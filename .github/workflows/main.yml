name: Build Starl APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        id: locate
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          WRAPPER=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "No gradlew found inside ZIP. It must contain the full Android project."
            exit 1
          fi
          echo "project_dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Starl-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
