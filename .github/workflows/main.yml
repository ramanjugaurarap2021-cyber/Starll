name: Build Starl APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found in repository."
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Android project
        run: |
          WRAPPER=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: ZIP must contain a complete Android project with gradlew."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Starl-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
